name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  test:
    name: typecheck, unit tests, browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-bookworm
        # Trust auth: some tests rewrite the connection URL to log in as a project role, which assumes a URL without a password.
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
      # A real, independent S3 server (not our own code) for the object storage tests; default keys accessKey1 / verySecretKey1.
      s3:
        image: zenko/cloudserver
        ports: ["8000:8000"]
    env:
      BAAS_TEST_S3_ENDPOINT: http://localhost:8000
      BAAS_TEST_PG_URL: postgres://postgres@localhost:5432/postgres
      BAAS_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Give Postgres headroom (every test creates its own databases and roles)
        run: |
          psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 500" -c "ALTER SYSTEM SET fsync = off"
          docker restart "$(docker ps -q --filter ancestor=postgres:16-bookworm)"
          until pg_isready -h localhost -U postgres; do sleep 1; done
      - name: pg_dump / pg_restore for the backup tests (same major version as the server)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --check dashboard/app.js
      - run: npm test
      - name: Install Chromium for the browser tests
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: e2e/screenshots, if-no-files-found: ignore, retention-days: 7 }

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl
      - name: The TLS proxy configuration is valid
        run: |
          docker run --rm -e DOMAIN=example.com -e DASHBOARD_HOST=baas.example.com -e ACME_EMAIL=ci@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          POSTGRES_PASSWORD=x BAAS_MASTER_KEY=x BAAS_BOOTSTRAP_TOKEN=x DOMAIN=example.com DASHBOARD_HOST=baas.example.com ACME_EMAIL=ci@example.com \
            docker compose -f docker-compose.yml -f docker-compose.tls.yml config --quiet
      - name: The S3 storage overlay is valid
        run: |
          POSTGRES_PASSWORD=x BAAS_MASTER_KEY=x BAAS_BOOTSTRAP_TOKEN=x S3_ACCESS_KEY_ID=x S3_SECRET_ACCESS_KEY=y docker compose -f docker-compose.yml -f docker-compose.s3.yml config --quiet
      - name: The point-in-time recovery and multi-node overlays are valid
        run: |
          POSTGRES_PASSWORD=x BAAS_MASTER_KEY=x BAAS_BOOTSTRAP_TOKEN=x docker compose -f docker-compose.yml -f docker-compose.pitr.yml config --quiet
          POSTGRES_PASSWORD=x BAAS_MASTER_KEY=x BAAS_BOOTSTRAP_TOKEN=x BAAS_PITR_ARCHIVE_TOKEN=x docker compose -f docker-compose.yml -f docker-compose.pitr-shared.yml config --quiet
          POSTGRES_PASSWORD=x BAAS_MASTER_KEY=x BAAS_BOOTSTRAP_TOKEN=x docker compose -f docker-compose.yml -f docker-compose.nodes.yml config --quiet
          docker run --rm -v "$PWD/deploy/Caddyfile.lb:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - run: scripts/smoke.sh
      - name: Smoke test with WAL archiving, restoring a project to a moment in time
        run: SMOKE_PITR=1 scripts/smoke.sh
      - name: Smoke test with the WAL archive in the shared store (Postgres uploads over HTTP), restoring to a moment in time
        run: SMOKE_PITR=shared scripts/smoke.sh
      - name: Smoke test with two nodes behind a load balancer, stopping the leader
        run: SMOKE_NODES=2 scripts/smoke.sh
      - name: Smoke test keeping object files in an S3 server, on two nodes with no shared storage
        run: SMOKE_S3=1 SMOKE_NODES=2 scripts/smoke.sh
