# Keep object files in an S3-compatible store instead of a local volume, so baas nodes need no shared filesystem:
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d
# This bundles SeaweedFS as the store. To use AWS S3, R2, B2 or your own MinIO/Ceph instead, drop the `s3` service below and set
# S3_ENDPOINT, S3_BUCKET, S3_REGION, S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY on `baas` (see .env.example).
# Moving existing files over:  baas admin storage migrate   (with BAAS_STORAGE_DIR still mounted)
services:
  s3:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: server -s3 -s3.config=/etc/s3.json -dir=/data
    configs:
      - source: s3conf
        target: /etc/s3.json
    volumes: [s3data:/data]
  baas:
    depends_on:
      s3: { condition: service_started }
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
      S3_BUCKET: ${S3_BUCKET:-baas}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_CREATE_BUCKET: "true"
configs:
  s3conf:
    content: |
      {"identities":[{"name":"baas","credentials":[{"accessKey":"${S3_ACCESS_KEY_ID}","secretKey":"${S3_SECRET_ACCESS_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
volumes:
  s3data:
